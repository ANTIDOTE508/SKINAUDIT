  /* Dark vignette — heavy left/bottom, lighter right where products are */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right,  rgba(6,5,4,0.82) 0%, rgba(6,5,4,0.55) 55%, rgba(6,5,4,0.30) 100%),
      linear-gradient(to bottom, rgba(6,5,4,0.55) 0%, rgba(6,5,4,0.10) 40%, rgba(6,5,4,0.72) 100%);
  }

  /* ── Top bar ───────────────────────────────────────────────────────────── */
  .topbar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    padding: 0 48px;
    height: 64px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    gap: 24px;
  }

  .wordmark {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: var(--text-primary);
    opacity: 0.9;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .progress-track {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
  }

  .progress-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
