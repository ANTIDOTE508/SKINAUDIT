<title>Skin Audit — Product Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">

<style>
  /* ── Tokens ─────────────────────────────────────────────────────────────── */
  :root {
    --bg:             #060504;
    --surface:        #0e0c0a;
    --surface-raised: #161310;
    --border:         #2a2520;
    --text-primary:   #fafaf8;
    --text-secondary: #d4d2ca;
    --text-muted:     #b8b5ab;
    --cta:            #c4b09a;
    --cta-hover:      #d0bcaa;
    --cta-text:       #09080a;
    --danger:         #9a6a6a;
    --danger-hover:   #b07a7a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ── App shell ───────────────────────────────────────────────────────────── */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    max-width: 820px;
    margin: 0 auto;
  }

  /* ── Top bar ─────────────────────────────────────────────────────────────── */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 32px;
    height: 64px;
    flex-shrink: 0;
  }

  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    opacity: 0.65;
    padding: 6px;
    margin-left: -6px;
    display: flex;
    align-items: center;
    transition: opacity 0.15s;
    appearance: none;
    -webkit-appearance: none;
    flex-shrink: 0;
  }
  .back-btn:hover { opacity: 1; }
  .back-btn:focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; }

  .topbar-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--text-primary);
    flex: 1;
    letter-spacing: 0.02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Scrollable body ─────────────────────────────────────────────────────── */
  .body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── Product hero ────────────────────────────────────────────────────────── */
  .product-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 32px 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .hero-img {
    width: 80px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    opacity: 0.65;
  }

  .hero-brand {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.65;
    margin-bottom: 10px;
    display: block;
  }

  .hero-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1.22;
    margin-bottom: 10px;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }

  .hero-size {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    opacity: 0.6;
    letter-spacing: 0.04em;
    margin-bottom: 20px;
    display: block;
  }

  .hero-badges {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .badge {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.65;
    border: 1px solid var(--border);
    padding: 3px 10px;
  }

  .badge.status-active {
    border-color: rgba(196,176,154,0.4);
    color: var(--cta);
    opacity: 0.9;
  }

  /* ── Meta strip ──────────────────────────────────────────────────────────── */
  .meta-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .meta-label {
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.5;
  }

  .meta-value {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .meta-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* ── Section label ───────────────────────────────────────────────────────── */
  .section-header {
    padding: 28px 32px 12px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.5;
  }

  /* ── Action rows ─────────────────────────────────────────────────────────── */
  .action-group {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .action-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    background: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 0;
    box-shadow: none;
    font-family: 'Jost', sans-serif;
    color: var(--text-primary);
    transition: background 0.12s;
  }
  .action-row:last-child { border-bottom: none; }
  .action-row:hover { background: var(--surface); }
  .action-row:focus-visible { outline: 2px solid var(--cta); outline-offset: -2px; }
  .action-row.danger { color: var(--danger); }
  .action-row.danger:hover { background: rgba(154,106,106,0.06); }

  .action-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--text-muted);
    opacity: 0.55;
  }
  .action-row.danger .action-icon { color: var(--danger); opacity: 0.7; }

  .action-text { flex: 1; }

  .action-label {
    display: block;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: inherit;
    margin-bottom: 2px;
  }

  .action-desc {
    display: block;
    font-size: 11px;
    font-weight: 300;
    color: var(--text-muted);
    opacity: 0.6;
    letter-spacing: 0.01em;
  }
  .action-row.danger .action-desc { color: var(--danger); opacity: 0.65; }

  .action-arrow {
    color: var(--text-muted);
    opacity: 0.25;
    flex-shrink: 0;
  }
  .action-row.danger .action-arrow { opacity: 0; }

  /* ── Notes section ───────────────────────────────────────────────────────── */
  .notes-wrap {
    margin: 0 32px 40px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .notes-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.5;
    margin-bottom: 10px;
    display: block;
  }

  .notes-text {
    font-size: 13px;
    font-weight: 300;
    color: var(--text-muted);
    opacity: 0.7;
    line-height: 1.65;
    letter-spacing: 0.01em;
    font-style: italic;
  }

  .notes-placeholder {
    font-size: 12px;
    font-weight: 300;
    color: var(--text-muted);
    opacity: 0.35;
    letter-spacing: 0.02em;
    cursor: text;
  }

  /* ── Desktop ─────────────────────────────────────────────────────────────── */
  @media (min-width: 900px) {
    .topbar { padding: 0 48px; }
    .product-hero { padding: 56px 48px 44px; }
    .hero-name { font-size: 30px; }
    .meta-strip { padding: 18px 48px; gap: 32px; }
    .section-header { padding: 32px 48px 14px; }
    .action-row { padding: 20px 48px; }
    .notes-wrap { margin: 0 48px 48px; }
  }

  /* ── Mobile ──────────────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .topbar { padding: 0 20px; height: 56px; }
    .product-hero { padding: 36px 24px 32px; }
    .hero-name { font-size: 22px; }
    .hero-img { width: 64px; height: 96px; margin-bottom: 22px; }
    .meta-strip { padding: 14px 24px; gap: 16px; }
    .section-header { padding: 22px 20px 10px; }
    .action-row { padding: 16px 20px; gap: 14px; }
    .notes-wrap { margin: 0 20px 40px; }
  }
</style>

<div class="app">

  <!-- ── Top bar ───────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <button class="back-btn" type="button" aria-label="Back" onclick="location.href='screen-08-dossier-populated.html'">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="12,4 6,10 12,16"></polyline>
      </svg>
    </button>
    <h1 class="topbar-title">Product Detail</h1>
  </header>

  <!-- ── Body ──────────────────────────────────────────────────────────────── -->
  <div class="body">

    <!-- Product hero -->
    <div class="product-hero">
      <div class="hero-img" aria-hidden="true">
        <svg width="52" height="88" viewBox="0 0 24 40" fill="none" stroke="#d4d2ca" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="14" width="14" height="24" rx="2"></rect>
          <rect x="7" y="8" width="10" height="7" rx="1"></rect>
          <line x1="12" y1="3" x2="12" y2="8"></line>
          <circle cx="12" cy="2" r="1.5"></circle>
          <line x1="7" y1="22" x2="17" y2="22" stroke-opacity="0.35" stroke-width="0.9"></line>
          <line x1="7" y1="26" x2="14" y2="26" stroke-opacity="0.35" stroke-width="0.9"></line>
        </svg>
      </div>
      <span class="hero-brand">Paula's Choice</span>
      <h2 class="hero-name">Skin Perfecting 2% BHA Liquid Exfoliant</h2>
      <span class="hero-size">118 ml · Leave-on exfoliant</span>
      <div class="hero-badges">
        <span class="badge">Treatment</span>
        <span class="badge status-active">Active</span>
      </div>
    </div>

    <!-- Meta strip -->
    <div class="meta-strip">
      <div class="meta-item">
        <span class="meta-label">Added</span>
