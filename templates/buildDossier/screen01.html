<title>Skin Audit — Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">

<style>
  /* ── Tokens ─────────────────────────────────────────────────────────────── */
  :root {
    --bg:             #060504;
    --text-primary:   #fafaf8;
    --text-secondary: #d4d2ca;
    --text-muted:     #b8b5ab;
    --cta:            #c4b09a;
    --cta-hover:      #d0bcaa;
    --cta-text:       #09080a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Full-screen hero ───────────────────────────────────────────────────── */
  .screen {
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: flex-end;
  }

  .hero-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  /* Gradient scrim — dark at bottom for content readability */
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(6,5,4,0.18) 0%,
        rgba(6,5,4,0.10) 30%,
        rgba(6,5,4,0.55) 65%,
        rgba(6,5,4,0.90) 100%
      );
  }

  /* ── Wordmark — top left ────────────────────────────────────────────────── */
  .wordmark {
    position: fixed;
    top: 40px;
    left: 48px;
    z-index: 2;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: rgba(250,250,248,0.55);
    user-select: none;
  }

  /* ── Content — anchored to bottom ──────────────────────────────────────── */
  .content {
    position: relative;
    z-index: 1;
    width: 100%;
    padding: 0 72px 80px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: end;
    gap: 0 80px;
  }

  .content-left h1 {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: clamp(48px, 5.5vw, 80px);
    font-weight: 300;
    font-style: normal;
    line-height: 1.05;
    color: var(--text-primary);
    text-wrap: balance;
    margin-bottom: 0;
  }

  .content-right {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding-bottom: 6px;
  }

  .subtext {
    font-size: 13.5px;
    font-weight: 300;
    line-height: 1.72;
    color: var(--text-secondary);
    margin-bottom: 32px;
    max-width: 340px;
    letter-spacing: 0.01em;
  }

  .counter {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--text-muted);
    opacity: 0.65;
    margin-bottom: 18px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 360px;
    height: 52px;
    background: var(--cta);
    color: var(--cta-text);
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border: none;
    border-radius: 0;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    box-shadow: none;
    transition: background 0.18s;
  }

  .btn-primary:hover { background: var(--cta-hover); }
  .btn-primary:focus-visible { outline: 2px solid var(--cta); outline-offset: 3px; }

  .btn-skip {
    display: block;
    width: 100%;
    max-width: 360px;
    padding: 8px 0;
    margin-top: 16px;
    background: none;
    border: none;
    border-radius: 0;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.16em;
    color: var(--text-muted);
    opacity: 0.55;
    text-align: center;
    transition: opacity 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .btn-skip:hover { opacity: 0.85; }
  .btn-skip:focus-visible { outline: 2px solid var(--cta); outline-offset: 3px; }

  /* ── Tablet ─────────────────────────────────────────────────────────────── */
  @media (max-width: 1024px) {
    .content {
      padding: 0 48px 64px;
      gap: 0 56px;
    }
    .wordmark { left: 36px; top: 32px; }
  }

  /* ── Mobile ─────────────────────────────────────────────────────────────── */
  @media (max-width: 720px) {
    .hero-bg { position: fixed; }

    .wordmark { left: 24px; top: 24px; }

    .content {
      grid-template-columns: 1fr;
      padding: 0 24px 56px;
      gap: 32px 0;
    }

    .content-left h1 { font-size: clamp(44px, 12vw, 58px); }

    .btn-primary,
    .btn-skip { max-width: 100%; }
  }
</style>
