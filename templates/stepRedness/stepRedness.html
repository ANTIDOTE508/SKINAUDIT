<title>SkinAudit Screen 16 Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&amp;display=swap">
<style>
/* Layout: one centred column of question cards on a plain dark ground. One card open at a time; answered cards fold into one-line summaries above it. Single dark theme to match SkinAudit. */
:root{
  --bg:#0b0a09; --glass:rgba(20,18,16,.7); --line:rgba(239,233,225,.10); --line-2:rgba(239,233,225,.20);
  --fg:#efe9e1; --muted:#b0a69b; --faint:#7d746b;
  --sand:#d6c3ae; --sand-ink:#1a1612; --sand-wash:rgba(214,195,174,.12);
  --flush:#c98b7f; --ok:#a9c3a0;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter:16px;
  color-scheme:dark;
}
@media (min-width:700px){:root{--gutter:32px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line)}

.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) 14px;border-width:0 0 1px}
.brand{font-family:var(--display);letter-spacing:.42em;font-size:13px;white-space:nowrap}
.prog{flex:1;max-width:420px;height:2px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-left:auto}
.prog i{display:block;height:100%;width:74%;background:var(--sand)}
.step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:480px){.prog{display:none}.step{margin-left:auto}}

main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-inline:var(--gutter);padding-block:28px 140px;display:flex;flex-direction:column;gap:12px}
@media (min-width:1024px){main{padding-top:56px}}

/* folded (answered) questions */
.done{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px}
.done .tick{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(169,195,160,.15);color:var(--ok);font-size:12px;flex:none}
.done .txt{flex:1;min-width:0}
.done .q{font-size:12px;color:var(--muted)}
.done .a{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .edit{font-size:12.5px;color:var(--sand);padding:6px 8px;border-radius:8px}
.done .edit:hover{background:var(--sand-wash)}

/* open question */
.card{border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;animation:rise .35s ease-out}
@media (min-width:700px){.card{padding:28px}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.count{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.2vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}

.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line-2);border-radius:14px;padding:14px;background:rgba(0,0,0,.2);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--sand);background:var(--sand-wash)}
.opt[aria-checked="true"] .dot{border-color:var(--sand)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--sand)}

/* face */
.face-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:400px){.face-wrap{grid-template-columns:130px minmax(0,1fr)}}
.face{width:100%;height:auto;display:block}
.face .outline{fill:none;stroke:var(--line-2);stroke-width:1.5}
.face .deco{fill:none;stroke:var(--faint);stroke-width:1.2;stroke-linecap:round}
.zone{fill:var(--flush);fill-opacity:.06;stroke:var(--flush);stroke-opacity:.3;stroke-width:1;cursor:pointer;transition:fill-opacity .15s}
.zone:hover{fill-opacity:.2}
.zone.on{fill-opacity:.55;stroke-opacity:.9}
.zone:focus-visible{outline:none;stroke-opacity:1;stroke-width:2.5}
.zchips{display:flex;flex-wrap:wrap;gap:8px}
.zchip{border:1px solid var(--line-2);border-radius:999px;padding:7px 13px;font-size:13.5px}
.zchip[aria-pressed="true"]{background:var(--sand);color:var(--sand-ink);border-color:var(--sand)}
.sidehint{font-size:12px;color:var(--faint);margin-top:10px}

/* triggers */
.trig{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:900px){.trig{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line-2);border-radius:14px;padding:12px;background:rgba(0,0,0,.2);min-height:84px;transition:border-color .15s,background .15s}
.tile svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-weight:500;font-size:14px}
.tile small{font-size:11.5px;color:var(--faint);line-height:1.3}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--sand);background:var(--sand-wash)}
.tile[aria-pressed="true"] svg{stroke:var(--sand)}
.tile.none{border-style:dashed;justify-content:center}
.tile.none b{color:var(--muted)}
.tile.none[aria-pressed="true"]{border-style:solid}
.tile.none[aria-pressed="true"] b{color:var(--fg)}
.row-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.row-actions span{font-size:12.5px;color:var(--faint);margin-right:auto}
.cont{background:var(--sand);color:var(--sand-ink);border-radius:999px;padding:10px 20px;font-weight:500;font-size:14px}
.cont[disabled]{opacity:.4;cursor:default}

/* fade timeline */
.fade{position:relative;padding:8px 4px 0}
.fade .rail{position:absolute;left:calc(16.66% + 4px);right:calc(16.66% + 4px);top:26px;height:6px;border-radius:3px;background:var(--line)}
.fade .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--flush),rgba(201,139,127,.15));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stops{position:relative;display:grid;grid-template-columns:repeat(3,1fr)}
.stop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 4px}
.stop .pt{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:#161412;transition:all .2s}
.stop b{font-weight:500;font-size:14px}
.stop small{font-size:12px;color:var(--faint);line-height:1.3}
.stop[aria-checked="true"] .pt{border-color:var(--flush);background:var(--flush);box-shadow:0 0 0 6px rgba(201,139,127,.18)}
.stop:hover .pt{border-color:var(--muted)}

.allset{border-radius:18px;padding:18px;display:flex;gap:12px;align-items:center;font-size:14px}
.allset .tick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(169,195,160,.15);color:var(--ok);flex:none}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;border-width:1px 0 0;padding:12px var(--gutter) calc(14px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px}
.status{flex:1;font-size:13px;color:var(--muted);min-width:0}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none}
.next{background:var(--sand);color:var(--sand-ink);border-radius:999px;padding:12px 26px;font-weight:500;font-size:14px;letter-spacing:.04em;flex:none}
.next[aria-disabled="true"]{opacity:.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar glass">
  <span class="brand">SKINAUDIT</span>
  <span class="prog" aria-hidden="true"><i></i></span>
  <span class="step">16 / 21</span>
</header>

<main id="main" aria-live="polite"><section class="card glass" aria-label="Persistent redness"><span class="count">Question 1 of 4</span><div><h1>Do you notice redness on your cheeks, nose, or chin that's there most of the time?</h1><p class="hint">Not related to a breakout, exercise, or heat.</p></div><div class="opts two" role="radiogroup"><button class="opt" role="radio" aria-checked="true" data-persist="0"><span class="dot"></span>Yes — it's there consistently</button><button class="opt" role="radio" aria-checked="false" data-persist="1"><span class="dot"></span>Yes — but it comes and goes</button><button class="opt" role="radio" aria-checked="false" data-persist="2"><span class="dot"></span>Occasionally</button><button class="opt" role="radio" aria-checked="false" data-persist="3"><span class="dot"></span>No</button></div></section></main>

<footer class="foot glass">
  <div class="foot-in">
    <button class="back" aria-label="Back">←</button>
    <span class="status" id="status">1 of 4 answered</span>
    <button class="next" id="next" aria-disabled="true">Next</button>
  </div>
</footer>

<script>
const PERSIST = ["Yes — it's there consistently","Yes — but it comes and goes","Occasionally","No"];
const AREAS = {cheeks:"Cheeks", nose:"Nose", chin:"Chin", forehead:"Forehead"};
const ICON = {
  heat:'<path d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 11v5"/>',
  exercise:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  alcohol:'<path d="M8 3h8l-1 7a3 3 0 0 1-6 0L8 3zM12 13v7M8 20h8"/>',
  spicy:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1 1 2 2 3 4 0-3-1-5 0-7z"/>',
  cold:'<path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h8"/>',
  stress:'<path d="M13 3L6 13h5l-1 8 7-10h-5l1-8z"/>',
  products:'<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>'
};
const TRIGGERS = [
  ["heat","Heat","Warm rooms, hot drinks, hot showers"],["exercise","Exercise",""],["alcohol","Alcohol",""],
  ["spicy","Spicy food",""],["cold","Cold or wind",""],["stress","Stress","Or strong emotions"],
  ["products","Skincare that stings","Products that sting or burn"]
];
const FADE = [["Within a few minutes","Minutes"],["Within 30–60 minutes","Within the hour"],["It takes hours, or lingers into the next day","Hours or longer"]];
const FADE_SUB = ["Gone quickly","30–60 minutes","Lingers, maybe into the next day"];

// First view: nothing answered, only question 1 open.
const S = { persist:null, areas:[], areasOk:false, triggers:[], none:false, trigOk:false, fade:null, editing:null };

const $ = s => document.querySelector(s);
const steps = () => ["persist", ...(S.persist===null ? ["areas?"] : S.persist!==3 ? ["areas"] : []), "triggers", ...(S.trigOk && !S.none ? ["fade"] : S.trigOk ? [] : ["fade?"])];
const isDone = k => k==="persist" ? S.persist!==null : k==="areas" ? S.areasOk && S.areas.length>0 : k==="triggers" ? S.trigOk : k==="fade" ? S.fade!==null : false;
const realSteps = () => steps().filter(k => !k.endsWith("?"));
function active(){ if (S.editing) return S.editing; return realSteps().find(k=>!isDone(k)) || null; }
function total(){ return steps().length; }

const SHORT = {persist:"Persistent redness", areas:"Where it shows", triggers:"What makes you flush", fade:"How fast flushing fades"};
function answer(k){
  if (k==="persist") return PERSIST[S.persist];
  if (k==="areas") return S.areas.map(a=>AREAS[a]).join(", ");
  if (k==="triggers") return S.none ? "None of the above" : S.triggers.map(t=>TRIGGERS.find(x=>x[0]===t)[1]).join(", ");
  if (k==="fade") return FADE[S.fade][0];
}

function face(){
  const z = k => `class="zone ${S.areas.includes(k)?"on":""}" data-zone="${k}" tabindex="0" role="checkbox" aria-checked="${S.areas.includes(k)}" aria-label="${AREAS[k]}"`;
  return `<svg class="face" viewBox="0 0 200 240" aria-label="Face areas">
    <path class="outline" d="M100 18C152 18 170 60 167 112C164 162 148 204 100 222C52 204 36 162 33 112C30 60 48 18 100 18Z"/>
    <path class="deco" d="M60 104q12-7 24 0M116 104q12-7 24 0M88 176q12 7 24 0"/>
    <g ${z("forehead")}><ellipse cx="100" cy="62" rx="50" ry="22"/></g>
    <g ${z("nose")}><ellipse cx="100" cy="136" rx="12" ry="24"/></g>
    <g ${z("cheeks")}><ellipse cx="62" cy="150" rx="20" ry="22"/><ellipse cx="138" cy="150" rx="20" ry="22"/></g>
    <g ${z("chin")}><ellipse cx="100" cy="203" rx="19" ry="10"/></g>
  </svg>`;
}

function card(k){
  const list = steps(), n = list.indexOf(k) + 1, of = list.length;
  const head = (q, h) => `<span class="count">Question ${n} of ${of}</span><div><h1>${q}</h1>${h?`<p class="hint">${h}</p>`:""}</div>`;
  if (k==="persist") return head("Do you notice redness on your cheeks, nose, or chin that's there most of the time?", "Not related to a breakout, exercise, or heat.") +
    `<div class="opts two" role="radiogroup">${PERSIST.map((l,i)=>`<button class="opt" role="radio" aria-checked="${S.persist===i}" data-persist="${i}"><span class="dot"></span>${l}</button>`).join("")}</div>`;
  if (k==="areas") return head("Where is the redness most noticeable?", "Tap the face or the names. Select all that apply.") +
    `<div class="face-wrap">${face()}<div><div class="zchips">${Object.entries(AREAS).map(([key,l])=>`<button class="zchip" data-zone="${key}" aria-pressed="${S.areas.includes(key)}">${l}</button>`).join("")}</div>
     <p class="sidehint">${S.areas.length ? S.areas.length+" selected" : "Nothing selected yet"}</p></div></div>
     <div class="row-actions"><button class="cont" data-cont="areas" ${S.areas.length?"":"disabled"}>Continue</button></div>`;
  if (k==="triggers") return head("Does your face flush or turn red easily with any of these?", "Select all that apply.") +
    `<div class="trig">${TRIGGERS.map(([key,l,sub])=>`<button class="tile" data-trig="${key}" aria-pressed="${S.triggers.includes(key)}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[key]}</svg><b>${l}</b>${sub?`<small>${sub}</small>`:""}</button>`).join("")}<button class="tile none" data-none aria-pressed="${S.none}"><b>None of the above</b><small>Doesn't flush easily</small></button></div>
     <div class="row-actions"><span>${S.none ? "No triggers" : S.triggers.length ? S.triggers.length+" selected" : "Pick at least one, or none"}</span><button class="cont" data-cont="triggers" ${S.none||S.triggers.length?"":"disabled"}>Continue</button></div>`;
  if (k==="fade") return head("When flushing happens, how quickly does the redness usually fade?", "") +
    `<div class="fade"><div class="rail"><div class="fill" style="width:${S.fade===null?0:S.fade*50}%"></div></div>
     <div class="stops" role="radiogroup">${FADE.map(([full,short],i)=>`<button class="stop" role="radio" aria-checked="${S.fade===i}" aria-label="${full}" data-fade="${i}"><span class="pt"></span><b>${short}</b><small>${FADE_SUB[i]}</small></button>`).join("")}</div></div>`;
}

function render(){
  const a = active(), list = realSteps();
  let h = "";
  for (const k of list){
    if (k===a) { h += `<section class="card glass" aria-label="${SHORT[k]}">${card(k)}</section>`; continue; }
    if (isDone(k)) h += `<div class="done glass"><span class="tick" aria-hidden="true">✓</span><div class="txt"><div class="q">${SHORT[k]}</div><div class="a">${answer(k)}</div></div><button class="edit" data-edit="${k}" aria-label="Edit ${SHORT[k]}">Edit</button></div>`;
    else break;   // later questions stay hidden until they're reached
  }
  if (!a) h += `<div class="allset glass"><span class="tick" aria-hidden="true">✓</span><span>That's everything on redness. Tap Next to continue.</span></div>`;
  $("#main").innerHTML = h;
  $("#status").textContent = a ? `${list.filter(isDone).length} of ${steps().length} answered` : "All answered";
  $("#next").setAttribute("aria-disabled", !!a);
}

function advance(){ S.editing = null; setTimeout(()=>{ render(); const c = document.querySelector(".card"); if (c && innerWidth < 1024) c.scrollIntoView({block:"nearest", behavior:"smooth"}); }, 260); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button, .zone"); if (!t) return;
  if (t.dataset.persist){ S.persist = +t.dataset.persist; if (S.persist===3){ S.areas=[]; S.areasOk=false; } render(); advance(); return; }
  if (t.dataset.zone){ const z=t.dataset.zone; S.areas = S.areas.includes(z) ? S.areas.filter(x=>x!==z) : [...S.areas,z]; render(); return; }
  if (t.dataset.trig){ const k=t.dataset.trig; S.none=false; S.triggers = S.triggers.includes(k) ? S.triggers.filter(x=>x!==k) : [...S.triggers,k]; render(); return; }
  if (t.hasAttribute("data-none")){ S.none=!S.none; if (S.none) S.triggers=[]; render(); return; }
  if (t.dataset.cont==="areas"){ S.areasOk=true; advance(); return; }
  if (t.dataset.cont==="triggers"){ S.trigOk=true; if (S.none) S.fade=null; advance(); return; }
  if (t.dataset.fade){ S.fade=+t.dataset.fade; render(); advance(); return; }
  if (t.dataset.edit){ S.editing=t.dataset.edit; if (t.dataset.edit==="triggers") S.trigOk=false; if (t.dataset.edit==="areas") S.areasOk=false; render(); return; }
});
document.addEventListener("keydown", e=>{ if ((e.key==="Enter"||e.key===" ") && e.target.classList?.contains("zone")){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click",{bubbles:true})); } });
render();
</script>

</body></html>
