<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Obsidian background -->
  <rect width="32" height="32" rx="6" fill="#0d0d0b"/>

  <!-- Outer sienna ring — the "audit lens" -->
  <circle cx="16" cy="15" r="9.5" stroke="#b8863d" stroke-width="0.9" opacity="0.9"/>

  <!-- Inner thin ring — depth -->
  <circle cx="16" cy="15" r="7" stroke="#b8863d" stroke-width="0.4" opacity="0.35"/>

  <!-- Monogram "S" — Cormorant-style, ultra-thin, alabaster -->
  <path
    d="M13.6 11.4 C13.6 11.4 14.2 10.6 15.8 10.6 C17.6 10.6 18.6 11.5 18.6 12.7 C18.6 14.0 17.5 14.6 16.1 15.1 C14.6 15.6 13.4 16.3 13.4 17.7 C13.4 19.0 14.5 19.8 16.2 19.8 C17.8 19.8 18.5 19.1 18.5 19.1"
    stroke="#fafaf5"
    stroke-width="0.85"
    stroke-linecap="round"
    opacity="0.92"
  />

  <!-- Gold tick mark — the "audit" checkmark, bottom-right of lens -->
  <path
    d="M20.5 20.5 L22.8 22.8"
    stroke="#b8863d"
    stroke-width="1.1"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M22.0 22.0 L25.2 25.2"
    stroke="#b8863d"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.7"
  />
</svg>
